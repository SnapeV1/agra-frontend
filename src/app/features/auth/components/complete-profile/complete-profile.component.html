<app-navigation></app-navigation>
<div class="complete-container">
  <div class="complete-card">
    <div class="complete-header">
      <div class="logo">
        <span class="brand-image"><img src="assets/logo2.png" alt="YEFFA Logo"></span>
      </div>
      <h2>Complete Your Profile</h2>
      <p>Add the missing info to continue.</p>
    </div>

    <form (ngSubmit)="submit()">
      <div class="form-group" *ngIf="isMissing('phone')">
        <label for="phone">Phone Number</label>
        <div class="phone-input-container">
          <div class="country-code-wrapper">
            <div class="custom-select" [class.open]="isCountryDropdownOpen" (keydown)="onDropdownKeydown($event)" tabindex="0">
              <div class="select-trigger" (click)="toggleCountryDropdown()">
                <span class="selected-country">
                  <span class="fi fi-{{ getSelectedCountry().country.toLowerCase() }}"></span>
                  {{ selectedCountryCode || 'Select' }}
                </span>
                <svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none">
                  <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <div class="select-options" *ngIf="isCountryDropdownOpen">
                <div class="select-option country-option" *ngFor="let country of countryCodes" (click)="selectCountry(country)" [class.selected]="selectedCountryCode === country.code" [class.highlighted]="highlightedCountry && highlightedCountry.code === country.code">
                  <span class="fi fi-{{ country.country.toLowerCase() }}"></span>
                  <span class="country-code">{{ country.code }}</span>
                </div>
              </div>
            </div>
          </div>
          <div class="phone-input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input type="tel" id="phone" name="phone" [(ngModel)]="phone" (input)="onPhoneInput($event)" (keydown)="onPhoneKeydown($event)" placeholder="123-456-7890" required />
          </div>
        </div>
      </div>

      <div class="form-group" *ngIf="isMissing('address')">
        <label for="address">Address</label>
        <div class="input-wrapper">
          <input id="address" name="address" [(ngModel)]="address" type="text" placeholder="Street, City, Country" />
        </div>
      </div>

      <div class="form-group" *ngIf="isMissing('language')">
        <label for="language">Preferred Language</label>
        <div class="input-wrapper">
          <select id="language" name="language" [(ngModel)]="language" required>
            <option value="">Select language</option>
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="ar">Arabic</option>
          </select>
        </div>
      </div>

      

      <div *ngIf="error" class="error">{{ error }}</div>
      <div *ngIf="success" class="success">Profile updated.</div>

      <button class="primary" type="submit" [disabled]="isLoading">{{ isLoading ? 'Saving…' : 'Save and Continue' }}</button>
    </form>
  </div>
  <div class="complete-bg"><div class="background-overlay"></div></div>
</div>

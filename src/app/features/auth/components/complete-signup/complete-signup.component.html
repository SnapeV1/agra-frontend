<app-navigation></app-navigation>
<div class="complete-container">
  <div class="complete-card">
    <div class="complete-header">
      <div class="logo">
        <span class="brand-image"><img src="assets/logo2.png" alt="YEFFA Logo"></span>
      </div>
      <h2>Finish Setting Up Your Account</h2>
      <p>Choose a password to also sign in with email.</p>
    </div>

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input id="password" name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="Create a password" required minlength="8" />
          <button type="button" class="password-toggle" (click)="showPassword = !showPassword" aria-label="Toggle password visibility">{{ showPassword ? 'Hide' : 'Show' }}</button>
        </div>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <div class="input-wrapper">
          <input id="confirm" name="confirm" [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" placeholder="Re-enter password" required />
          <button type="button" class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword" aria-label="Toggle confirm visibility">{{ showConfirmPassword ? 'Hide' : 'Show' }}</button>
        </div>
      </div>

      <div *ngIf="error" class="error">{{ error }}</div>
      <div *ngIf="success" class="success">Password saved. Redirecting…</div>

      <button class="primary" type="submit" [disabled]="isLoading">{{ isLoading ? 'Saving…' : 'Save Password' }}</button>
      <button class="link" type="button" (click)="skip()">Skip for now</button>
    </form>
  </div>
  <div class="complete-bg"><div class="background-overlay"></div></div>
</div>

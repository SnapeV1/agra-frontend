<app-navigation></app-navigation>
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">
        <span class="brand-image"><img src="assets/logo2.png" alt="YEFFA Logo"></span>
      </div>
      <h1>Sign in to YEFFA</h1>
      <p>Welcome back! Choose a sign-in method.</p>
    </div>

    <!-- Email/Password Login -->
    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"></path><path d="M22 6l-10 7L2 6"></path></svg>
          </span>
          <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="you@example.com" required />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <input id="password" name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="••••••••" required />
          <button type="button" class="password-toggle" (click)="showPassword = !showPassword" aria-label="Toggle password visibility">
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-6.94"/><path d="M1 1l22 22"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M14.12 14.12L9.88 9.88"/></svg>
          </button>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

      <button class="login-btn" type="submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign in</span>
        <span *ngIf="isLoading" class="loading-spinner"></span>
      </button>
    </form>

    <div class="divider"><span>Or continue with</span></div>

    <!-- Google Login -->
    <div class="social-login" style="display:flex;flex-direction:column;align-items:center;">
      <div id="gsi-button" style="display:flex;justify-content:center;margin-top:8px;"></div>
      <div *ngIf="isLoading" class="loading-spinner" style="margin-top:12px;"></div>
    </div>

    <div class="signup-link" style="margin-top:16px;">
      <p>New here? <a routerLink="/register">Create an account</a></p>
    </div>
  </div>

  <div class="login-background">
    <div class="background-overlay"></div>
  </div>
</div>

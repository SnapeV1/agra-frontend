<!-- Mobile overlay -->
<div class="mobile-overlay" [class.active]="isMobileOpen" (click)="sidebarService.closeMobile()"></div>

<nav
  class="sidebar"
  [class.collapsed]="isCollapsed"
  [class.mobile-open]="isMobileOpen"
  [class.initial-load]="initialLoad"
  [style.width.px]="sidebarWidth"
  id="sidebar"
  (click)="onSidebarClick($event)">
  <!-- Hamburger toggle when collapsed (top-left) -->
  <button class="toggle-btn collapsed-toggle"
          *ngIf="isCollapsed"
          (click)="toggleSidebar()"
          [attr.aria-label]="'Expand sidebar'">
    <span class="icon-round">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 18l6-6-6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </button>
  <button class="toggle-btn"
          *ngIf="!isCollapsed"
          (click)="toggleSidebar()"
          [attr.aria-label]="'Collapse sidebar'">
    <span class="icon-round rotate-180">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 18l6-6-6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </button>
  
  <div class="sidebar-menu">
    <a routerLink="/admin/dashboard"
       class="menu-item" 
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: false }"
       data-tooltip="Dashboard"
       (click)="setActiveMenuItem('dashboard')">
      <i class="fas fa-tachometer-alt"></i>
      <span class="menu-text">Dashboard</span>
    </a>

    <a routerLink="/admin/users"
       class="menu-item" 
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: false }"
       data-tooltip="Users"
       (click)="setActiveMenuItem('users')">
      <i class="fas fa-users"></i>
      <span class="menu-text">Users</span>
    </a>

    <a routerLink="/admin/posts"
       class="menu-item" 
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: false }"
       data-tooltip="Posts"
       (click)="setActiveMenuItem('posts')">
      <i class="fas fa-newspaper"></i>
      <span class="menu-text">Posts</span>
    </a>

    <a routerLink="/admin/courses"
       class="menu-item" 
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: false }"
       data-tooltip="Courses"
       (click)="setActiveMenuItem('courses')">
      <i class="fas fa-graduation-cap"></i>
      <span class="menu-text">Courses</span>
    </a>

    <a routerLink="/admin/tickets"
       class="menu-item"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: false }"
       data-tooltip="Tickets"
       (click)="setActiveMenuItem('tickets')">
      <i class="fas fa-ticket-alt"></i>
      <span class="menu-text">Tickets</span>
    </a>

    <a routerLink="/admin/certificates"
       class="menu-item"
       routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: false }"
       data-tooltip="Certificates"
       (click)="setActiveMenuItem('certificates')">
      <i class="fas fa-certificate"></i>
      <span class="menu-text">Certificates</span>
    </a>

  </div>
</nav>

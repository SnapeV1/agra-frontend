<nav class="navbar" [class.scrolled]="isScrolled">
    <div class="nav-container">
        <div class="nav-brand">
            <span class="nav-logo">  <img src="assets/logo2.png" alt="App Logo"></span>
        </div>
        
<div class="nav-menu">
    <a [routerLink]="'/home'" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="onNavLinkClick()">Home</a>
    <a [routerLink]="'/courses'" routerLinkActive="active" (click)="onNavLinkClick()">Courses</a>
    <a [routerLink]="'/feed'" routerLinkActive="active" (click)="onNavLinkClick()">Feed</a>
    <a [routerLink]="'/contact'" routerLinkActive="active" (click)="onNavLinkClick()">Contact us</a>
</div>

        <div class="nav-auth">
          
               <a href="/admin/dashboard" class="admin-view-btn" title="View as Admin" *ngIf="isLoggedIn && isAdmin()">
    <span class="material-symbols-outlined">visibility</span>
</a>


            <button 
                *ngIf="!isLoggedIn" 
                class="auth-btn login-btn" 
                (click)="login()">
                <span class="btn-icon"></span>
                Se connecter
            </button>
            
            <div *ngIf="isLoggedIn" class="user-menu">
                <div class="profile-dropdown" (click)="toggleDropdown()">
                    <img 
                        [src]="getUserAvatar()" 
                        [alt]="getUserDisplayName()" 
                        class="profile-avatar">
                    <span class="profile-name">{{ getUserDisplayName() }}</span>
                  
                    <span class="dropdown-arrow" [class.open]="isDropdownOpen">▼</span>
                </div>
                
                <div class="dropdown-menu" [class.show]="isDropdownOpen">
                    <div class="dropdown-header">
                        <img 
                            [src]="getUserAvatar()" 
                            [alt]="getUserDisplayName()" 
                            class="dropdown-avatar">
                        <div class="dropdown-user-info">
                            <div class="dropdown-name">{{ getUserDisplayName() }}</div>
                            <div class="dropdown-email">{{ getUserEmail() }}</div>
                            <div class="dropdown-role" *ngIf="getUserRole()" [ngClass]="getUserRole().toLowerCase()">
                                {{ getUserRole() }}
                            </div>
                        </div>
                    </div>
                    
                    <div class="dropdown-divider"></div>
                    
                    <!-- Dashboard link -->
                    <a href="#" class="dropdown-item" (click)="navigateToDashboard()">
            <lucide-icon name="bar-chart-2" class="w-4 h-4"></lucide-icon>
                        <span *ngIf="isAdmin()">Admin Dashboard</span>
                        <span *ngIf="!isAdmin()">Dashboard</span>
                    </a>
                    
                    <!-- Profile link -->
                    <a class="dropdown-item" (click)="navigateToProfile()">
            <lucide-icon name="user" class="w-4 h-4"></lucide-icon>
                        Profil
                    </a>
                    
                    <!-- Settings link -->
                    <a href="#" class="dropdown-item" (click)="navigateToSettings()">
            <lucide-icon name="settings" class="w-4 h-4"></lucide-icon>
                        Paramètres
                    </a>
                    
                    <!-- Admin-only section -->
                    <div *ngIf="isAdmin()">
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item admin" (click)="router.navigate(['/admin']); closeDropdown()">
<lucide-icon name="wrench" class="w-4 h-4"></lucide-icon>
                            Administration
                        </a>
                    </div>
                    
                    <div class="dropdown-divider"></div>
                    
                    <!-- Logout -->
                    <a href="#" class="dropdown-item logout" (click)="signOut()">
            <lucide-icon name="log-out" class="w-4 h-4"></lucide-icon>
                        Se déconnecter
                    </a>
                </div>
            </div>

            <!-- Token expiration warning -->
            <div *ngIf="isLoggedIn && authService.isTokenExpiringSoon()" class="token-warning">
                ⚠️ Session expires soon
            </div>
        </div>

        <button class="mobile-toggle" 
                [class.active]="isMobileMenuOpen"
                (click)="toggleMobileMenu()"
                aria-label="Toggle mobile menu">
            <div class="hamburger-container">
                <div class="hamburger-bar"></div>
                <div class="hamburger-bar"></div>
                <div class="hamburger-bar"></div>
            </div>
        </button>
    </div>
</nav>

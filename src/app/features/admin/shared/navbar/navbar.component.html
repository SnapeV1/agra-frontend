<nav class="navbar">
  <div class="navbar-left">
    <h1 class="page-title">{{ pageTitle }}</h1>
    <div class="breadcrumbs">
      <ng-container *ngFor="let breadcrumb of breadcrumbs; let last = last">
        <a *ngIf="!last" [routerLink]="breadcrumb.route">{{ breadcrumb.label }}</a>
        <span *ngIf="last">{{ breadcrumb.label }}</span>
        <span *ngIf="!last"> / </span>
      </ng-container>
    </div>
  </div>

  <div class="navbar-search">
    <input
      class="search-input"
      [(ngModel)]="searchQuery"
      (keyup.enter)="onSearch()"
      placeholder="Search..."
    />
    <span class="material-symbols-outlined search-icon"></span>
  </div>
  <div class="navbar-right">
    <button class="action-btn" (click)="notificationClick.emit()">
      <span class="material-symbols-outlined"></span>
      <span class="notification-badge" *ngIf="notificationCount > 0">
        {{ notificationCount > 99 ? '99+' : notificationCount }}
      </span>
    </button>

    <button class="action-btn" (click)="settingsClick.emit()">
      <span class="material-symbols-outlined"></span>
    </button>

    <div class="profile" (click)="toggleDropdown()">
      <div class="profile-avatar">{{ userInitials }}</div>
      <div class="profile-info">
        <div class="profile-name">{{ userName }}</div>
        <div class="profile-role">{{ userRole }}</div>
      </div>
      <span class="material-symbols-outlined chevron-icon"></span>
    </div>

    <div class="dropdown-menu" [class.show]="isDropdownOpen">
      <button class="dropdown-item" (click)="profileClick.emit()">Profile</button>
      <button class="dropdown-item danger" (click)="logout()">Logout</button>
    </div>
  </div>
</nav>

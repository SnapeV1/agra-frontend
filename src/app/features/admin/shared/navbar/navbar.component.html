<nav class="navbar">
  <div class="navbar-left">
    <h1 class="page-title">{{ pageTitle }}</h1>
    <div class="breadcrumbs" *ngIf="breadcrumbs.length > 0">
      <ng-container *ngFor="let crumb of breadcrumbs; let last = last">
        <a *ngIf="crumb.route && !last" [routerLink]="crumb.route">{{ crumb.label }}</a>
        <span *ngIf="!crumb.route || last">{{ crumb.label }}</span>
        <span *ngIf="!last">/</span>
      </ng-container>
    </div>
  </div>

  <div class="navbar-search">
    <input
      class="search-input"
      placeholder="Search..."
      [(ngModel)]="searchQuery"
      (keyup)="onSearchKeyup($event)"
    />
    <span class="material-symbols-outlined search-icon"></span>
  </div>

  <div class="navbar-right">
    <button 
      class="action-btn" 
      (click)="onNotificationClick()" 
      title="Notifications"
      type="button"
    >
      <span class="material-symbols-outlined"></span>
      <span class="notification-badge" *ngIf="notificationCount > 0">{{ notificationCount }}</span>
    </button>

    <button 
      class="action-btn" 
      (click)="onSettingsClick()" 
      title="Settings"
      type="button"
    >
      <span class="material-symbols-outlined"></span>
    </button>

    <button 
      class="action-btn" 
      (click)="navigateToHome()" 
      title="View as User"
      type="button"
    >
      <span class="material-symbols-outlined"></span>
    </button>

    <div class="profile" (click)="toggleDropdown()">
      <div class="profile-avatar">{{ userInitials }}</div>
      <div class="profile-info">
        <div class="profile-name">{{ userName }}</div>
        <div class="profile-role">{{ userRole }}</div>
      </div>
      <span class="material-symbols-outlined chevron-icon"></span>
    </div>

    <div class="dropdown-menu" [class.show]="isDropdownOpen">
      <button class="dropdown-item" (click)="onProfileClick()" type="button">
        Profile
      </button>
      <button class="dropdown-item danger" (click)="logout()" type="button">
        Logout
      </button>
    </div>
  </div>
</nav>

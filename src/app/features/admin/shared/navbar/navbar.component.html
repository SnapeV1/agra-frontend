<nav class="navbar">
  <div class="navbar-left">
    <button class="mobile-sidebar-toggle" 
            [class.active]="sidebarService.getMobileState()"
            (click)="toggleMobileSidebar()"
            aria-label="Toggle sidebar">
      <div class="hamburger-container">
        <div class="hamburger-bar"></div>
        <div class="hamburger-bar"></div>
        <div class="hamburger-bar"></div>
      </div>
    </button>
    <h1 class="page-title">{{ pageTitle }}</h1>
    <div class="breadcrumbs" *ngIf="breadcrumbs.length > 0">
      <ng-container *ngFor="let crumb of breadcrumbs; let last = last">
        <a *ngIf="crumb.route && !last" [routerLink]="crumb.route">{{ crumb.label }}</a>
        <span *ngIf="!crumb.route || last">{{ crumb.label }}</span>
        <span *ngIf="!last">/</span>
      </ng-container>
    </div>
  </div>

  <div class="navbar-search">
    <input
      class="search-input"
      placeholder="Search..."
      [(ngModel)]="searchQuery"
      (keyup)="onSearchKeyup($event)"
    />
    <span class="material-symbols-outlined search-icon"></span>
  </div>

  <div class="navbar-right">
    <div class="notif-menu">
      <button 
        class="action-btn" 
        (click)="toggleNotif()" 
        aria-label="Notifications"
        title="Notifications"
        type="button"
      >
        <span class="material-symbols-outlined"></span>
        <span class="notification-badge" *ngIf="notificationCount > 0">{{ notificationCount }}</span>
      </button>
      <div class="notif-dropdown" [class.show]="isNotifOpen">
        <div class="notif-header">
          <span>Notifications</span>
          <div class="actions">
            <button class="mark-read" (click)="markAllNotificationsAsRead()" [disabled]="notificationCount === 0">Mark all as read</button>
            <button class="mark-read" (click)="deleteAllNotifications()" [disabled]="notifications.length === 0">Clear all</button>
          </div>
        </div>
        <div class="notif-list" *ngIf="notifications?.length; else noAdminNotif">
          <div class="notif-item" *ngFor="let n of notifications" [class.unread]="!n.seen" (click)="openNotification(n)">
            <div class="notif-dot" *ngIf="!n.seen"></div>
            <div class="notif-content">
              <div class="notif-title">{{ n.content }}</div>
              <div class="notif-meta">
                <span class="notif-tag" *ngIf="n.type">{{ formatNotificationType(n.type) }}</span>
                <span class="notif-time">{{ n.timestamp | date:'short' }}</span>
              </div>
            </div>
          </div>
        </div>
        <ng-template #noAdminNotif>
          <div class="notif-empty">You're all caught up!</div>
        </ng-template>
      </div>
    </div>


    <button 
      class="action-btn" 
      (click)="navigateToHome()" 
      title="View as User"
      type="button"
    >
      <span class="material-symbols-outlined"></span>
    </button>

    <div class="profile" (click)="toggleDropdown()">
      <div class="profile-avatar">{{ userInitials }}</div>
      <div class="profile-info">
        <div class="profile-name">{{ userName }}</div>
        <div class="profile-role">{{ userRole }}</div>
      </div>
      <span class="material-symbols-outlined chevron-icon"></span>
    </div>

    <div class="dropdown-menu" [class.show]="isDropdownOpen">
      <button class="dropdown-item" (click)="onProfileClick()" type="button">
        Profile
      </button>
      <button class="dropdown-item" (click)="navigateToSettings()" type="button">
        Settings
      </button>
      <button class="dropdown-item danger" (click)="logout()" type="button">
        Logout
      </button>
    </div>
  </div>
</nav>

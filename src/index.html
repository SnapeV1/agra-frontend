<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AgraFrontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    (function() {
      try {
        var pref = localStorage.getItem('pref_theme');
        var isDark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.backgroundColor = '#0f172a';
        }
      } catch (e) {}
    })();
  </script>
  <style>
    html[data-theme="dark"] body { background-color: #0f172a; }
    html[data-theme="dark"] .section { background-color: #111827; }
    /* Cookie banner styling */
    .cookie-banner {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 9999;
      display: none;
      gap: 16px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 12px;
      background: #ffffff;
      color: #111827;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.04);
      border: 1px solid #e5e7eb;
    }
    html[data-theme="dark"] .cookie-banner {
      background: #1f2937;
      color: #e5e7eb;
      border-color: #374151;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 1px 1px rgba(0,0,0,0.3);
    }
    .cookie-banner__text { flex: 1; font-size: 14px; line-height: 1.4; }
    .cookie-banner__actions { display: flex; gap: 10px; }
    .cookie-btn {
      border: 1px solid #d1d5db;
      background: #fff;
      color: #111827;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .cookie-btn:hover { transform: translateY(-1px); border-color: #9ca3af; }
    .cookie-btn--primary { background: #10b981; border-color: #10b981; color: white; }
    .cookie-btn--primary:hover { background: #059669; border-color: #059669; }
    html[data-theme="dark"] .cookie-btn { background: #111827; color: #e5e7eb; border-color: #374151; }
    html[data-theme="dark"] .cookie-btn:hover { border-color: #4b5563; }
    html[data-theme="dark"] .cookie-btn--primary { background: #059669; border-color: #059669; }
    html[data-theme="dark"] .cookie-btn--primary:hover { background: #047857; border-color: #047857; }
  </style>
  </style>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: http:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdnjs.cloudflare.com; connect-src 'self' http: https: ws: wss:; frame-src 'self' https: http:;">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
  <!-- Cookie consent banner -->
  <div id="cookie-banner" class="cookie-banner" role="dialog" aria-live="polite" aria-label="Cookie consent">
    <div class="cookie-banner__text">
      This website uses cookies to make your experience better. By clicking “Accept”, you agree to the storing of cookies on your device.
    </div>
    <div class="cookie-banner__actions">
      <button id="cookie-accept" class="cookie-btn cookie-btn--primary" type="button">Accept</button>
      <button id="cookie-later" class="cookie-btn" type="button">Later</button>
    </div>
  </div>
  <script>
    (function() {
      try {
        var consent = localStorage.getItem('cookie_consent');
        var hasCookies = (document.cookie || '').trim().length > 0;
        var show = (!hasCookies) && consent !== 'accepted';
        var banner = document.getElementById('cookie-banner');
        if (banner && show) {
          banner.style.display = 'flex';
        }
        var accept = document.getElementById('cookie-accept');
        var later = document.getElementById('cookie-later');
        if (accept) {
          accept.addEventListener('click', function() {
            try { localStorage.setItem('cookie_consent', 'accepted'); } catch (e) {}
            if (banner) banner.style.display = 'none';
          });
        }
        if (later) {
          later.addEventListener('click', function() {
            if (banner) banner.style.display = 'none';
          });
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
